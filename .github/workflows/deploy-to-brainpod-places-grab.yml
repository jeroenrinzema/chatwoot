name: Brainpod places-grab

on:
  push:
    branches: ["develop", "brainpod/onboarding-places-grab"]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ["self-hosted","brainpod-local"]
    steps:
      - uses: actions/checkout@v5
      - uses: brainpodnl/actions/build@v1
        with:
          pod: places-grab
          api-url: http://api.brainpod.localhost
          registry: registry.brainpod.localhost
